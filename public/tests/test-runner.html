<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Editor Test Runner</title>
    <style>
        body {
            font-family: monospace;
            background: #1e1e2f;
            color: #fff;
            padding: 20px;
        }

        .success {
            color: #4ade80;
        }

        .failure {
            color: #f87171;
        }

        .suite {
            font-weight: bold;
            margin-top: 10px;
            font-size: 1.2em;
            color: #a78bfa;
        }
    </style>
    <!-- Dependencies for tests -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-functions-compat.js"></script>

    <!-- Test Setup -->
    <script src="setup.js?v=2"></script>
</head>

<body>
    <h1>🧪 AI Editor Test Runner</h1>
    <div id="output">Running tests... Check console</div>

    <!-- Import and Run Tests -->
    <script type="module">
        const originalLog = console.log;
        const output = document.getElementById('output');
        output.innerHTML = '';

        console.log = (...args) => {
            originalLog(...args);
            const line = document.createElement('div');
            const text = args.map(a => String(a)).join(' ');

            if (text.includes('✅')) line.className = 'success';
            if (text.includes('❌')) line.className = 'failure';
            if (text.includes('📦')) line.className = 'suite';

            line.textContent = text;
            output.appendChild(line);
        };

        console.error = (...args) => {
            const line = document.createElement('div');
            line.className = 'failure';
            line.textContent = args.map(a => String(a)).join(' ');
            output.appendChild(line);
        };

        async function loadTests() {
            // Append timestamp to force reload
            const t = Date.now();
            const testFiles = [
                `./unit/state.test.js?t=${t}`,
                `./unit/render-engine.test.js?t=${t}`,
                `./unit/layout-engine.test.js?t=${t}`,
                `./unit/magic-create.test.js?t=${t}`,
                `./unit/pdf-export.test.js?t=${t}`,
                `./unit/photo-resolution.test.js?t=${t}`,
                `./unit/text-alignment.test.js?t=${t}`,
                `./unit/services/ai-service.test.js?t=${t}`,
                `./unit/services/google-photos.test.js?t=${t}`,
                `./integration/state-to-render.test.js?t=${t}`,
                `./integration/magic-create-flow.test.js?t=${t}`,
                `./integration/photos-to-layout.test.js?t=${t}`,
                `./integration/export-flow.test.js?t=${t}`
            ];

            for (const file of testFiles) {
                try {
                    await import(file);
                } catch (e) {
                    console.error(`Failed to load ${file}`, e);
                }
            }
        }

        window.BACKGROUND_TEXTURES = [];

        loadTests();
    </script>
</body>

</html>
