<style>
    /* Antigrevity Design System */

    :root {
        /* Colors - Primary */
        --color-text-primary: #222325;
        --color-text-secondary: #404145;
        --color-text-muted: #62646A;
        --color-text-subtle: #74767E;

        /* Backgrounds */
        --color-bg-primary: #FFFFFF;
        --color-bg-secondary: #FAFAFA;
        --color-bg-hover: #F7F7F7;

        /* Borders */
        --color-border-default: #DADBDD;
        --color-border-subtle: #E4E5E7;

        /* Accents */
        --color-accent-teal: #49A2A5;
        --color-accent-purple: #7283C8;
        --color-accent-gold: #C28D54;
        --color-accent-yellow: #FFB800;
        --color-accent-lime: #E8F094;
        --color-accent-dark: #222325;

        /* Spacing Scale (4px base) */
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 20px;
        --space-6: 24px;
        --space-8: 32px;
        --space-10: 40px;
        --space-12: 48px;
        --space-14: 56px;

        /* Border Radius */
        --radius-sm: 2px;
        --radius-md: 8px;
        --radius-lg: 12px;
        --radius-xl: 16px;
        --radius-full: 50%;

        /* Shadows */
        --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
        --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.12);
        --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.12);

        /* Transitions */
        --transition-default: all 0.2s ease;
    }

    /* Typography */
    body {
        font-family: 'Macan', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        color: var(--color-text-primary);
        background-color: var(--color-bg-secondary);
        /* Default app background */
        line-height: 1.5;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
        color: var(--color-text-primary);
        font-weight: 700;
        margin: 0;
    }

    .display-text {
        font-size: 32px;
        line-height: 38px;
    }

    h1 {
        font-size: 28px;
        line-height: 36px;
    }

    h2 {
        font-size: 20px;
        line-height: 28px;
    }

    h3 {
        font-size: 16px;
        line-height: 24px;
    }

    .body-text {
        font-size: 16px;
        line-height: 24px;
        font-weight: 400;
    }

    .body-small {
        font-size: 14px;
        line-height: 22px;
        font-weight: 400;
    }

    .label-text {
        font-size: 16px;
        line-height: 24px;
        font-weight: 600;
    }

    .caption-text {
        font-size: 14px;
        line-height: 22px;
        font-weight: 400;
        color: var(--color-text-muted);
    }

    /* Utilities & Components */

    /* Buttons */
    .btn-primary {
        min-width: 160px;
        height: 40px;
        padding: 10px 16px;
        background: var(--color-text-primary);
        /* #222325 */
        color: white;
        border: none;
        border-radius: var(--radius-md);
        font-size: 14px;
        font-weight: 600;
        line-height: 1;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: var(--transition-default);
        text-decoration: none;
        box-sizing: border-box;
    }

    .btn-primary:hover {
        background: var(--color-text-secondary);
        /* #404145 */
    }

    /* Secondary Button */
    .btn-secondary {
        min-width: 160px;
        height: 40px;
        padding: 10px 16px;
        background: transparent;
        border: 1px solid var(--color-text-primary);
        color: var(--color-text-primary);
        border-radius: var(--radius-md);
        font-size: 14px;
        font-weight: 600;
        line-height: 1;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: var(--transition-default);
        text-decoration: none;
        box-sizing: border-box;
    }

    .btn-secondary:hover {
        background: var(--color-bg-hover);
    }

    .btn-secondary:disabled,
    .btn-primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        background-color: var(--color-border-subtle);
        border-color: var(--color-border-subtle);
        color: var(--color-text-muted);
    }


    /* Cards */
    .card {
        background: var(--color-bg-primary);
        border: 1px solid var(--color-border-default);
        border-radius: var(--radius-lg);
        padding: var(--space-8);
    }

    .service-card {
        background: var(--color-bg-primary);
        border: 1px solid var(--color-border-default);
        border-radius: var(--radius-lg);
        padding: var(--space-6);
        display: flex;
        flex-direction: column;
        gap: var(--space-6);
    }

    .full-width {
        width: 100%;
    }

    /* Inputs */
    input[type="text"],
    input[type="email"],
    textarea {
        padding: var(--space-2) var(--space-4);
        border: 1px solid var(--color-border-subtle);
        border-radius: var(--radius-md);
        font-size: 14px;
        font-family: inherit;
        line-height: 1.5;
        transition: var(--transition-default);
        background-color: var(--color-bg-primary);
        color: var(--color-text-primary);
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    textarea:focus {
        border-color: var(--color-text-primary);
        outline: none;
        box-shadow: 0 0 0 2px rgba(34, 35, 37, 0.1);
    }
</style>
